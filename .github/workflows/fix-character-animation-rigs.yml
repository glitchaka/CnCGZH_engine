name: Fix Character Animation Rigs

on:
  push:
    paths:
      - '.github/workflows/fix-character-animation-rigs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select the correct KayKit rig per character
        shell: python
        run: |
          from pathlib import Path
          p = Path('tools/character_lab/CharacterLab.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'struct CharacterEntry { std::string name; fs::path model; fs::path packRoot; };',
              'struct CharacterEntry { std::string name; fs::path model; fs::path packRoot; std::string rig; };'
          )
          s = s.replace(
              'out.push_back({it->path().stem().string(),it->path(),pack});',
              'std::string name=it->path().stem().string();\n            std::string rig=(name.size()>=6 && name.rfind("_Large")==name.size()-6)?"Rig_Large":"Rig_Medium";\n            out.push_back({name,it->path(),pack,rig});'
          )
          s = s.replace(
              'fs::path dir=c.packRoot/"Animations"/"gltf"/"Rig_Medium";if(!fs::exists(dir))return;',
              'fs::path dir=c.packRoot/"Animations"/"gltf"/c.rig;\n    if(!fs::exists(dir)){\n        dir=c.packRoot/"Animations"/"gltf"/"Rig_Medium";\n        if(!fs::exists(dir))return;\n    }'
          )
          s = s.replace(
              'status=modelLoaded?std::to_string(refs.size())+" animaciones cargadas":"No se pudo cargar el modelo";',
              'status=modelLoaded?std::to_string(refs.size())+" animaciones cargadas · "+chars[charIndex].rig:"No se pudo cargar el modelo";'
          )
          p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/character_lab/CharacterLab.cpp
          git commit -m "Use matching KayKit rig for character animations"
          git push
