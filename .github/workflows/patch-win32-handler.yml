name: Patch Win32 handler

on:
  push:
    branches: [studio-v2]
    paths: ['.github/workflows/patch-win32-handler.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio-v2
      - name: Remove internal-linkage redeclaration
        shell: python
        run: |
          from pathlib import Path
          p=Path('editor/src/main.cpp')
          s=p.read_text(encoding='utf-8')
          line='extern IMGUI_IMPL_API LRESULT ImGui_ImplWin32_WndProcHandler(HWND, UINT, WPARAM, LPARAM);\n'
          if line not in s:
              raise SystemExit('expected declaration not found')
          p.write_text(s.replace(line,''),encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/main.cpp
          git commit -m "Fix ImGui Win32 backend linkage"
          git push origin HEAD:studio-v2
