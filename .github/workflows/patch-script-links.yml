name: Patch visual script links

on:
  push:
    branches: [studio-v2]
    paths: ['.github/workflows/patch-script-links.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio-v2
      - name: Add interactive graph links
        shell: python
        run: |
          from pathlib import Path
          p=Path('editor/src/main.cpp')
          s=p.read_text(encoding='utf-8')
          old_in='for(size_t i=0;i<n.inputs.size();++i){ImVec2 pp={p.x+8,p.y+42+(float)i*22};pinPos[n.inputs[i].id]=pp;dl->AddCircleFilled(pp,5,IM_COL32(100,180,230,255));dl->AddText({pp.x+10,pp.y-7},IM_COL32(210,215,225,255),n.inputs[i].name.c_str());}'
          new_in='for(size_t i=0;i<n.inputs.size();++i){ImVec2 pp={p.x+8,p.y+42+(float)i*22};pinPos[n.inputs[i].id]=pp;dl->AddCircleFilled(pp,5,IM_COL32(100,180,230,255));dl->AddText({pp.x+10,pp.y-7},IM_COL32(210,215,225,255),n.inputs[i].name.c_str());ImGui::SetCursorScreenPos({pp.x-8,pp.y-8});ImGui::PushID((int)n.inputs[i].id);ImGui::InvisibleButton("inputPin",{16,16});if(ImGui::IsItemClicked()&&pendingPin&&pendingPinIsOutput){graph.links.erase(std::remove_if(graph.links.begin(),graph.links.end(),[&](const ScriptLink& l){return l.toPin==n.inputs[i].id;}),graph.links.end());graph.links.push_back({pendingPin,n.inputs[i].id});pendingPin=0;pendingPinIsOutput=false;}ImGui::PopID();}'
          old_out='for(size_t i=0;i<n.outputs.size();++i){ImVec2 pp={p.x+sz.x-8,p.y+42+(float)i*22};pinPos[n.outputs[i].id]=pp;dl->AddCircleFilled(pp,5,IM_COL32(235,170,80,255));float tw=ImGui::CalcTextSize(n.outputs[i].name.c_str()).x;dl->AddText({pp.x-10-tw,pp.y-7},IM_COL32(210,215,225,255),n.outputs[i].name.c_str());}'
          new_out='for(size_t i=0;i<n.outputs.size();++i){ImVec2 pp={p.x+sz.x-8,p.y+42+(float)i*22};pinPos[n.outputs[i].id]=pp;dl->AddCircleFilled(pp,5,IM_COL32(235,170,80,255));float tw=ImGui::CalcTextSize(n.outputs[i].name.c_str()).x;dl->AddText({pp.x-10-tw,pp.y-7},IM_COL32(210,215,225,255),n.outputs[i].name.c_str());ImGui::SetCursorScreenPos({pp.x-8,pp.y-8});ImGui::PushID((int)n.outputs[i].id);ImGui::InvisibleButton("outputPin",{16,16});if(ImGui::IsItemClicked()){pendingPin=n.outputs[i].id;pendingPinIsOutput=true;}ImGui::PopID();}'
          old_links='for(auto& l:graph.links){auto a=pinPos.find(l.fromPin),b=pinPos.find(l.toPin);if(a!=pinPos.end()&&b!=pinPos.end()){ImVec2 p1=a->second,p2=b->second;dl->AddBezierCubic(p1,{p1.x+65,p1.y},{p2.x-65,p2.y},p2,IM_COL32(180,190,205,255),2.5f);}}'
          new_links='for(auto& l:graph.links){auto a=pinPos.find(l.fromPin),b=pinPos.find(l.toPin);if(a!=pinPos.end()&&b!=pinPos.end()){ImVec2 p1=a->second,p2=b->second;dl->AddBezierCubic(p1,{p1.x+65,p1.y},{p2.x-65,p2.y},p2,IM_COL32(180,190,205,255),2.5f);}}if(pendingPin&&pendingPinIsOutput){auto a=pinPos.find(pendingPin);if(a!=pinPos.end()){ImVec2 p1=a->second,p2=ImGui::GetMousePos();dl->AddBezierCubic(p1,{p1.x+65,p1.y},{p2.x-65,p2.y},p2,IM_COL32(235,170,80,230),2.5f);}}if(ImGui::IsWindowHovered()&&ImGui::IsMouseClicked(ImGuiMouseButton_Right)){pendingPin=0;pendingPinIsOutput=false;}'
          old_fields='std::uint64_t selectedId=0,nextId=1,nextNodeId=1,nextPinId=1,deleteNodeId=0;ViewportRenderer renderer;'
          new_fields='std::uint64_t selectedId=0,nextId=1,nextNodeId=1,nextPinId=1,deleteNodeId=0,pendingPin=0;bool pendingPinIsOutput=false;ViewportRenderer renderer;'
          for old,new in [(old_in,new_in),(old_out,new_out),(old_links,new_links),(old_fields,new_fields)]:
              if old not in s:
                  raise SystemExit('expected source fragment not found')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/src/main.cpp
          git commit -m "Enable visual script pin connections"
          git push origin HEAD:studio-v2
