name: Finalize Spanish UI

on:
  push:
    paths:
      - '.github/workflows/finalize-spanish-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finish Spanish UI strings
        shell: python
        run: |
          from pathlib import Path

          p=Path('studio/src/main.cpp')
          s=p.read_text(encoding='utf-8')
          for a,b in {
            'Placement mode - click the 3D viewport; Esc cancels':'Colocación - haz clic en la vista 3D; Esc cancela',
            'L"Transform",MB_ICONWARNING':'L"Transformación",MB_ICONWARNING',
            'L"Play",MB_ICONERROR':'L"Probar",MB_ICONERROR',
          }.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')

          p=Path('tools/character_lab/CharacterLab.cpp')
          s=p.read_text(encoding='utf-8')
          for a,b in {
            'KayKit Adventurers 2.0 and Skeletons 1.1 were not found. Build the project once to prepare the sample assets.':'No se encontraron KayKit Adventurers 2.0 y Skeletons 1.1. Compila el proyecto una vez para preparar los recursos de muestra.',
            ' animations loaded':' animaciones cargadas',
            'Could not load model':'No se pudo cargar el modelo',
            '"Once"':'"Una vez"',
            '"Assign current animation"':'"Asignar animación actual"',
            '"Could not save profile"':'"No se pudo guardar el perfil"',
            'TextFormat("Frame %.1f / %d"':'TextFormat("Fotograma %.1f / %d"',
            '"RMB orbit | Wheel zoom"':'"Botón derecho: orbitar | Rueda: zoom"',
            '"Profile: "':'"Perfil: "',
          }.items(): s=s.replace(a,b)

          # Keep stable English action IDs in saved profiles, but show Spanish names.
          old='const std::vector<std::string> actions={"Idle","Move","Run","Attack","Interact","PickUp","UseItem","Hit","Death","Spawn"};'
          new='const std::vector<std::string> actions={"Idle","Move","Run","Attack","Interact","PickUp","UseItem","Hit","Death","Spawn"};\n    const std::vector<std::string> actionLabels={"Reposo","Mover","Correr","Atacar","Interactuar","Recoger","Usar objeto","Recibir golpe","Morir","Aparecer"};'
          if 'actionLabels=' not in s: s=s.replace(old,new)
          s=s.replace('DrawText(actions[i].c_str(),rx+6,(int)r.y+4,13,RAYWHITE);','DrawText(actionLabels[i].c_str(),rx+6,(int)r.y+4,13,RAYWHITE);')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/src/main.cpp tools/character_lab/CharacterLab.cpp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finish Spanish Studio and Character Lab UI"
          git push
