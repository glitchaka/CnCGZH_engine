name: Integrate Character Tools

on:
  push:
    paths:
      - '.github/workflows/localize-integrate-character-lab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localize Studio and integrate Character Lab
        shell: python
        run: |
          from pathlib import Path

          p = Path('studio/src/main.cpp')
          s = p.read_text(encoding='utf-8')

          s = s.replace('constexpr int ID_DELETE = 1027;', 'constexpr int ID_DELETE = 1027;\nconstexpr int ID_CHARACTER_LAB = 1028;')

          replacements = {
            'CnCGZH Studio - Scene Editor *':'CnCGZH Studio - Editor de escenas *',
            'CnCGZH Studio - Scene Editor':'CnCGZH Studio - Editor de escenas',
            ' assets ready':' recursos listos',
            'Select tool - click an object':'Seleccionar - haz clic en un objeto',
            'Move tool - drag selected object on the ground':'Mover - arrastra el objeto seleccionado sobre el suelo',
            'Rotate tool - drag horizontally':'Rotar - arrastra horizontalmente',
            'Scale tool - drag vertically':'Escalar - arrastra verticalmente',
            'Placement mode - click the viewport; Esc cancels':'Colocación - haz clic en la vista 3D; Esc cancela',
            'Scene modified':'Escena modificada',
            'Placed ':'Colocado: ',
            'One or more transform values are invalid.':'Uno o más valores de transformación no son válidos.',
            'Transform applied':'Transformación aplicada',
            'Object duplicated':'Objeto duplicado',
            'Object deleted':'Objeto eliminado',
            'Undo':'Deshacer',
            'Could not save the scene.':'No se pudo guardar la escena.',
            'Scene saved':'Escena guardada',
            'CnCGZHEngine.exe was not found beside Studio.':'No se encontró CnCGZHEngine.exe junto a Studio.',
            'Transform changed':'Transformación modificada',
            'Object nudged':'Objeto desplazado',
            'Clear the entire scene?':'¿Vaciar toda la escena?',
            'Scene cleared':'Escena vaciada',
            'Ready - select an asset to place it, or choose a transform tool':'Listo - selecciona un recurso para colocarlo o usa una herramienta de transformación',
            'Close without saving changes?':'¿Cerrar sin guardar los cambios?',
          }
          for a,b in replacements.items():
              s = s.replace(a,b)

          controls = {
            'L"Save"':'L"Guardar"',
            'L"PLAY"':'L"PROBAR"',
            'L"Clear"':'L"Limpiar"',
            'L"Select [Q]"':'L"Seleccionar [Q]"',
            'L"Move [W]"':'L"Mover [W]"',
            'L"Rotate [E]"':'L"Rotar [E]"',
            'L"Scale [R]"':'L"Escalar [R]"',
            'L"Grid snap 0.25"':'L"Cuadrícula 0.25"',
            'L"Apply"':'L"Aplicar"',
            'L"Duplicate"':'L"Duplicar"',
            'L"Delete"':'L"Eliminar"',
            'L"Ready"':'L"Listo"',
            'L"ASSETS"':'L"RECURSOS"',
            'L"SCENE"':'L"ESCENA"',
            'L"TRANSFORM"':'L"TRANSFORMACIÓN"',
            'L"Rotation"':'L"Rotación"',
            'L"Scale"':'L"Escala"',
          }
          for a,b in controls.items():
              s = s.replace(a,b)

          marker = '''void playScene() {\n    if(!saveScene()) return;'''
          if 'void openCharacterLab()' not in s:
              insertion = '''void openCharacterLab() {\n    fs::path exe=executablePath().parent_path()/"CnCGZHCharacterLab.exe";\n    if(!fs::exists(exe)){\n        MessageBoxW(gMain,L"No se encontró CnCGZHCharacterLab.exe junto a Studio. Compila el objetivo CnCGZHCharacterLab.",L"Personajes y animaciones",MB_ICONERROR);\n        return;\n    }\n    ShellExecuteW(gMain,L"open",exe.c_str(),nullptr,gRoot.c_str(),SW_SHOWNORMAL);\n}\n\n'''
              s = s.replace(marker, insertion + marker)

          old = 'MoveWindow(gSnap,kLeftW+338,14,110,24,TRUE);'
          new = 'MoveWindow(gSnap,kLeftW+338,14,118,24,TRUE);\n    MoveWindow(GetDlgItem(hwnd,ID_CHARACTER_LAB),kLeftW+462,10,190,30,TRUE);'
          s = s.replace(old,new)

          old = 'CreateWindowW(L"BUTTON",L"Limpiar",WS_CHILD|WS_VISIBLE|BS_PUSHBUTTON,0,0,90,30,hwnd,(HMENU)ID_CLEAR,nullptr,nullptr);'
          new = old + '\n            CreateWindowW(L"BUTTON",L"Personajes / Animaciones",WS_CHILD|WS_VISIBLE|BS_PUSHBUTTON,0,0,190,30,hwnd,(HMENU)ID_CHARACTER_LAB,nullptr,nullptr);'
          s = s.replace(old,new)

          s = s.replace('if(id==ID_PLAY){playScene();return 0;}', 'if(id==ID_PLAY){playScene();return 0;}\n            if(id==ID_CHARACTER_LAB){openCharacterLab();return 0;}')

          # Fix painted label lengths after translation.
          s = s.replace('TextOutW(dc,12,kToolbarH+10,L"RECURSOS",6);','TextOutW(dc,12,kToolbarH+10,L"RECURSOS",8);')
          s = s.replace('TextOutW(dc,r.right-kRightW+10,kToolbarH+10,L"ESCENA",5);','TextOutW(dc,r.right-kRightW+10,kToolbarH+10,L"ESCENA",6);')
          s = s.replace('TextOutW(dc,r.right-kRightW+10,kToolbarH+236,L"TRANSFORMACIÓN",9);','TextOutW(dc,r.right-kRightW+10,kToolbarH+236,L"TRANSFORMACIÓN",14);')
          s = s.replace('TextOutW(dc,rx,iy+106,L"Rotación",8); TextOutW(dc,rx,iy+140,L"Escala",5);','TextOutW(dc,rx,iy+106,L"Rotación",8); TextOutW(dc,rx,iy+140,L"Escala",6);')

          p.write_text(s,encoding='utf-8')

          p = Path('tools/character_lab/CharacterLab.cpp')
          s = p.read_text(encoding='utf-8')
          repl = {
            'CnCGZH Character Lab':'CnCGZH Laboratorio de personajes',
            'KayKit Adventurers 2.0 / Skeletons 1.1 were not found. Build the project once so the sample assets are prepared.':'No se encontraron KayKit Adventurers 2.0 / Skeletons 1.1. Compila el proyecto una vez para preparar los recursos de muestra.',
            'CHARACTERS':'PERSONAJES',
            'ANIMATIONS':'ANIMACIONES',
            'ACTIONS':'ACCIONES',
            'Pause':'Pausa',
            'Play':'Reproducir',
            'Loop':'Bucle',
            'Save profile':'Guardar perfil',
            'saved':'guardado',
            'compatible animations loaded':'animaciones compatibles cargadas',
            'Could not load character model':'No se pudo cargar el modelo del personaje',
            'Ready':'Listo',
            'Current animation':'Animación actual',
            'No animations':'Sin animaciones',
            'Assign selected animation':'Asignar animación seleccionada',
            'Animation assigned':'Animación asignada',
          }
          for a,b in repl.items(): s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
      - name: Commit integrated Spanish Studio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio/src/main.cpp tools/character_lab/CharacterLab.cpp
          git commit -m "Integrate character animation tools into Spanish Studio"
          git push
