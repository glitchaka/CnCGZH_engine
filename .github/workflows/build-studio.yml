name: Build Engine

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'engine/**'
      - 'runtime/**'
      - 'studio/**'
      - '.github/workflows/build-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build engine
        run: cmake --build build --config Release --target CnCGZHEngine
      - name: Build studio
        run: cmake --build build --config Release --target CnCGZHStudio
