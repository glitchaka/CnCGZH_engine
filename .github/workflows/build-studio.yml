name: Build Studio

on:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'editor/**'
      - 'compEng.bat'
      - '.github/workflows/build-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build Studio
        run: cmake --build build --config Release --target CnCGZHStudio
